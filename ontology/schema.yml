# ontology/schema.yml
#
# Human-readable source of truth for the GraphRAG-NK ontology.
# The executable DDL is in ontology/ontology.cypher.
# This file is the authoritative reference during design; the Cypher is its DB projection.
#
# Cross-references: FRAMEWORK_DESIGN.md §4; BUILD_SPEC.md §4 (data shapes).
# ─────────────────────────────────────────────────────────────────────────────

version: "0.1"
description: >
  Two-layer ontology for the GraphRAG-NK research pipeline.
  Layer 1 (SE-artefact) models what exists in a GitHub repository.
  Layer 2 (NK-analytical) overlays linguistic evidence of non-knowledge
  on top of the artefact layer, without coupling the two layers.

# ─────────────────────────────────────────────────────────────────────────────
# LAYER 1 — SE-artefact
# ─────────────────────────────────────────────────────────────────────────────
se_artefact_layer:
  nodes:
    Repository:
      natural_key: [full_name]
      properties:
        full_name:   {type: string, example: "python/cpython"}
        stars:       {type: integer}
        language:    {type: string}
        created_at:  {type: datetime}
        mined_at:    {type: datetime}

    Actor:
      natural_key: [login]
      properties:
        login: {type: string}
        type:  {type: string, enum: [User, Bot]}
        name:  {type: string, nullable: true}

    Issue:
      natural_key: [repo, number]
      properties:
        repo:       {type: string}
        number:     {type: integer}
        state:      {type: string, enum: [open, closed]}
        created_at: {type: datetime}
        closed_at:  {type: datetime, nullable: true}
        labels:     {type: list[string]}

    PullRequest:
      natural_key: [repo, number]
      properties:
        repo:       {type: string}
        number:     {type: integer}
        state:      {type: string, enum: [open, closed]}
        merged:     {type: boolean}
        created_at: {type: datetime}
        closed_at:  {type: datetime, nullable: true}

    Commit:
      natural_key: [sha]
      properties:
        sha:          {type: string}
        authored_at:  {type: datetime}
        committed_at: {type: datetime}
        message_summary: {type: string}  # first line of commit message

    Comment:
      natural_key: [github_comment_id]
      properties:
        github_comment_id: {type: string}
        kind: {type: string, enum: [issue, pr_review, pr_issue]}
        created_at: {type: datetime}

    TextUnit:
      natural_key: [id]
      description: >
        The atomic unit of NK analysis. Every piece of natural language text
        from any artefact (title, body, commit message, comment) is a TextUnit.
        Annotation always targets TextUnits, never raw artefacts directly.
        See FRAMEWORK_DESIGN.md §4.1 for the rationale.
      properties:
        id:          {type: string, example: "issue:python/cpython:12345:body"}
        text:        {type: string, description: "Raw text after stripping (see extractor)"}
        lang:        {type: string, example: "en", nullable: true}
        token_count: {type: integer, description: "Naive whitespace-split count"}
        sha256:      {type: string, description: "For dedup across artefacts"}
        position:    {type: integer, description: "Order within parent: 0=title,1=body,2+=comment"}
        created_at:  {type: datetime, nullable: true}

  relationships:
    CONTAINS:
      from: Repository
      to: [Issue, PullRequest, Commit]
    AUTHORED:
      from: Actor
      to: [Issue, PullRequest, Commit, Comment]
    HAS_COMMENT:
      from: [Issue, PullRequest]
      to: Comment
    HAS_TEXT:
      from: [Issue, PullRequest, Commit, Comment]
      to: TextUnit
      properties:
        role: {type: string, enum: [title, body, commit_message, comment_body]}
    REFERENCES:
      from: [PullRequest, Issue, Commit]
      to: Issue
      description: "Cross-references extracted from text (fixes #N, closes #N, etc.)"
      properties:
        mechanism: {type: string, enum: [closes, fixes, resolves, refs, see, bare]}
        source_text_unit: {type: string, description: "ID of the TextUnit containing the reference"}

# ─────────────────────────────────────────────────────────────────────────────
# MULTI-PLATFORM CORPUS LAYER (v0.8)
# ─────────────────────────────────────────────────────────────────────────────
# Cross-platform comparability layer for the curated MSR corpora. The GitHub
# nodes above (Repository/Issue/PullRequest/Commit/Comment/EmailMessage) become
# :Artefact + a family label + a platform label; new corpora (Jira, Bugzilla,
# Slack, Discord, Gitter, IRC, Stack Overflow, curated email) get first-class
# nodes of their own. Platform comparison (RQ6 / FRAMEWORK_DESIGN §4) is done
# through the shared :Artefact label and the platform_id property, never through
# ID prefixes.
# ─────────────────────────────────────────────────────────────────────────────
multiplatform_corpus_layer:
  design_principle: >
    One shared :Artefact label for every text-owning source object, with
    family labels (:IssueArtefact, :MessageArtefact, :PostArtefact,
    :CommitArtefact) and platform labels (:GitHubIssue, :JiraIssue, ...) added
    on top. "arena" (RQ6) is the platform/communication-channel-kind level;
    :Venue is the concrete container. See FRAMEWORK_DESIGN.md §4.8.

  nodes:
    Platform:
      natural_key: [platform_id]
      description: "Comparison dimension for RQ6: the kind of communication channel/platform."
      properties:
        platform_id: {type: string, enum: [github, jira, bugzilla, slack, discord, gitter, irc, stackoverflow, mailing_list]}
        name: {type: string}
        kind: {type: string, description: "coarse grouping: issue_tracker | chat | qa_site | email"}

    Venue:
      natural_key: [venue_id]
      description: "The concrete container within a platform: one repository, Jira project, Slack channel, IRC channel, SO site, Bugzilla product, mailing list."
      properties:
        venue_id: {type: string, example: "github:python/cpython", description: "{platform}:{corpus_or_org}:{external_id}"}
        platform_id: {type: string}
        corpus_id: {type: string}
        external_id: {type: string}
        name: {type: string, nullable: true}

    Corpus:
      natural_key: [corpus_id]
      description: "A curated dataset release with citation/license provenance."
      properties:
        corpus_id: {type: string}
        name: {type: string, nullable: true}
        version: {type: string, nullable: true}
        citation: {type: string, nullable: true}
        license: {type: string, nullable: true}
        source_uri: {type: string, nullable: true}

    Conversation:
      natural_key: [conversation_id]
      description: "Dataset-provided or inferred conversational grouping (Slack/Discord conversation IDs, IRC gold conversations, Gitter dialogs). Distinct from Venue (channel) and Message (utterance)."
      properties:
        conversation_id: {type: string}
        platform_id: {type: string}
        venue_id: {type: string}
        corpus_id: {type: string}
        source_label: {type: string, nullable: true, description: "the raw label from the dataset, e.g. 'T1234' or '1'"}

    Artefact:
      natural_key: [record_id]
      description: "Shared base label for every text-owning source object, across all platforms. record_id is globally namespaced. Do NOT construct by string-splitting — see FRAMEWORK_DESIGN.md §4.8."
      properties:
        record_id: {type: string, example: "jira_issue:apachejira:HBASE-1234"}
        platform_id: {type: string}
        venue_id: {type: string}
        corpus_id: {type: string}
        artefact_kind: {type: string, description: "issue | pull_request | commit | email | chat | irc | so_question | so_answer | so_comment"}
        source_corpus: {type: string, description: "alias of corpus_id, indexed for corpus-membership queries (no per-record CONTAINS edges)"}
        created_at: {type: datetime, nullable: true}
        metadata_json: {type: string, nullable: true, description: "JSON-serialised per-record leftovers; parse with apoc.convert.fromJsonMap"}

    # Family + platform specialisations (multi-label on one node):
    #   :Artefact:IssueArtefact:GitHubIssue    (:Issue repo key kept)
    #   :Artefact:IssueArtefact:JiraIssue
    #   :Artefact:IssueArtefact:BugzillaIssue
    #   :Artefact:IssueArtefact:OpenMentIssue / :NumFocusIssue
    #   :Artefact:MessageArtefact:EmailMessage (existing :EmailMessage urn key kept)
    #   :Artefact:MessageArtefact:SlackMessage / :DiscordMessage / :GitterMessage / :IRCMessage
    #   :Artefact:PostArtefact:StackOverflowQuestion / :StackOverflowAnswer / :StackOverflowComment
    #   :Artefact:CommitArtefact:GitHubCommit  (:Commit sha key kept)
    #
    # record_id uniqueness (ontology.cypher §1): besides the shared
    # artefact_record_id constraint on :Artefact, each externally-upserted
    # family label carries its OWN record_id constraint (chatmessage_record_id,
    # jiraissue_record_id, bugzillaissue_record_id, sopost_record_id). The
    # projector MERGEs on the family label directly, and without a per-label
    # constraint Neo4j falls back to a full label scan that grows linearly with
    # the corpus (CHANGELOG 2026-08-16). The :Artefact constraint alone does
    # not accelerate MERGE (m:ChatMessage {...}).

  relationships:
    HAS_VENUE:
      from: Platform
      to: Venue
    COVERS:
      from: Corpus
      to: Venue
      description: "Corpus provenance at venue granularity (not per-record — see FRAMEWORK_DESIGN.md §4.8)."
    CONTAINS:
      from: [Venue, Conversation]
      to: [Artefact]
      description: "Container-to-artefact; CONTAINS stays container-only."
    HAS_CONVERSATION:
      from: Venue
      to: Conversation
    AUTHORED:
      from: Actor
      to: [Artefact]
      description: "Reuses the existing :Actor node; external actors get namespaced login = '<platform>:<corpus_short>:<id>'."
    HAS_TEXT:
      from: [Issue, PullRequest, Commit, Comment, EmailMessage, Artefact]
      to: TextUnit
      description: "role vocabulary shared across platforms: title | body | comment_body | subject | commit_message | message"
    REPLIES_TO:
      from: [Artefact, EmailMessage]
      to: [Artefact, EmailMessage]
      description: "Message-level reply/threading links (IRC gold links, curated-email threading, Gitter no-reply-by-default)."
    ANSWERS:
      from: StackOverflowAnswer
      to: StackOverflowQuestion
      description: "Only when the source dataset provides the answer→question mapping (emotion workbook: parent Post IDs)."

# ─────────────────────────────────────────────────────────────────────────────
# LAYER 2 — NK-analytical
# ─────────────────────────────────────────────────────────────────────────────
nk_analytical_layer:
  design_principle: >
    Every detection is a distinct Signal node — never a property flag on TextUnit.
    This preserves multi-layer evidence structure and is the core commitment that
    makes RQ5 (classifier vs. linguistic evidence) tractable.
    See FRAMEWORK_DESIGN.md §1.2.

  nodes:
    Signal:
      natural_key: [id]
      description: >
        A single piece of evidence of non-knowledge, emitted by one annotator rule.
        Provenance (rule_id, rule_version) is mandatory — signals without provenance
        are invalid and must not be written to the graph.
      properties:
        id:           {type: string, description: "{text_unit_id}::{rule_id}::{span_start}"}
        layer:        {type: string, enum: [lexical, morpho_syntactic, word_formation, rhetorical, classifier]}
        category:     {type: string}
        subcategory:  {type: string, nullable: true}
        surface_form: {type: string}
        span_start:   {type: integer}
        span_end:     {type: integer}
        rule_id:      {type: string}
        rule_version: {type: string}
        confidence:   {type: float, nullable: true}
        payload_json: {type: string, description: "JSON-serialised supplementary provenance. Neo4j cannot store nested maps as properties, so payload is serialised. Parse in analysis with apoc.convert.fromJsonMap(sig.payload_json)."}

    LexicalMarker:
      natural_key: [lemma, lexicon_version]
      description: >
        A dictionary entry from lexicons/*.yml. Shared across all TextUnits —
        one node per marker, not one per occurrence. Enables corpus-wide
        marker frequency queries without scanning every Signal.
      properties:
        lemma:            {type: string}
        lexicon_version:  {type: string}
        pos:              {type: string}
        category:         {type: string}
        subcategory:      {type: string}
        polarity:         {type: string, enum: [neutral, pejorative, valorising]}
        source_citation:  {type: string}

    RhetoricalFigure:
      natural_key: [figure_id]
      description: >
        A figure type from patterns/rhetorical_*.yml. One node per figure type,
        not per occurrence. Enables figure inventory queries.
      properties:
        figure_id:        {type: string}
        family:           {type: string, enum: [metaphor, personification, hyperbole, comparison, irony]}
        subtype:          {type: string}
        description:      {type: string}
        source_citation:  {type: string}

    ClassifierVerdict:
      natural_key: [text_unit_id, model_id, model_version]
      description: >
        The RoBERTa classifier's per-TextUnit verdict. Kept separate from Signal
        to support RQ5: classifier vs. linguistic evidence disagreement analysis.
        See FRAMEWORK_DESIGN.md §2 (RQ5).
      properties:
        text_unit_id:  {type: string}
        model_id:      {type: string}
        model_version: {type: string}
        label:         {type: integer, enum: [0, 1]}
        confidence:    {type: float}
        predicted_at:  {type: datetime}

    IgnoranceType:
      natural_key: [type_id]
      description: >
        A taxonomic label (e.g. from Roberts 2013 Organizational Ignorance).
        NEVER assigned at ingest — only post-hoc by analysts or clustering.
        The scope field distinguishes imported types (from literature) from
        derived types (found empirically in SE data).
        See FRAMEWORK_DESIGN.md §4.5.
      properties:
        type_id:    {type: string}
        name:       {type: string}
        definition: {type: string}
        source:     {type: string}
        scope:      {type: string, enum: [imported, derived]}

  relationships:
    HAS_SIGNAL:
      from: TextUnit
      to: Signal
    MATCHES_MARKER:
      from: Signal
      to: LexicalMarker
      description: "Only for Signal.layer == 'lexical'"
    INSTANTIATES:
      from: Signal
      to: RhetoricalFigure
      description: "Only for Signal.layer == 'rhetorical'"
    CLASSIFIED_AS:
      from: TextUnit
      to: ClassifierVerdict
    TYPED_AS:
      from: TextUnit
      to: IgnoranceType
      description: "Post-hoc only. Never written by pipeline workers."
      properties:
        annotator:   {type: string}
        confidence:  {type: float, nullable: true}
        rationale:   {type: string, nullable: true}
        annotated_at: {type: datetime}
