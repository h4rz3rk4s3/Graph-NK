      - gross.non_knowledge
    source_examples: []
    near_neighbours:
    - type_id: gross.nescience
      relation: partial_overlap
      distinguishing_test: See gross.nescience — surprise is the revealing event/process, nescience is
        the revealed gap; a single unit reporting both may need dual coding or a foregrounding judgment.
    source_vagueness: '''Surprise'' functions in the book more as a companion process/outcome tied to
      the other categories (per the p. 76 quote on nescience) than as a cleanly defined discrete category
      in its own right; no accessed source presents a standalone definitional sentence for ''surprise''
      beyond this relational framing.'
    definition_confidence: medium
- taxonomy_id: wehling_2024
  citation: Wehling, P. (2024). Nichtwissen – ein ungewöhnlicher Schlüsselbegriff der Umweltsoziologie.
    In M. Sonnberger et al. (Eds.), Handbuch Umweltsoziologie (pp. 671-687). Springer Fachmedien Wiesbaden.
    https://doi.org/10.1007/978-3-658-37218-7_58
  structure: dimensional
  full_text_accessed: true
  access_note: Full text extracted directly from user-supplied book PDF (978-3-658-37218-7.pdf), chapter
    pp. 671-687 (PDF pages 658-674 in the physical page numbering used by the extraction). The chapter
    itself explicitly refers to a fuller elaboration of the same three-dimension scheme in Wehling 2006
    (Im Schatten des Wissens?, S. 116 ff.) which we do NOT have primary access to; page-numbers for that
    earlier, fuller source are UNVERIFIED and corroborated only via secondary web sources (a Peter Lang
    chapter quoting Wehling 2006:116ff, and a philou.rwth-aachen.de summary), consistent with but not
    identical to this chapter's condensed restatement.
  source_framing: 'Wehling explicitly rejects earlier typologies of ignorance variants (citing Smithson
    1989, Faber et al. 1992, Kerwin 1993) as either having unclear systematics or reducing to a binary
    contrast of purportedly clear ideal types (e.g. explicitly-intended vs entirely-unintended ignorance).
    He proposes instead three dimensions along which non-knowledge is socially perceived and evaluated,
    explicitly designed to capture intermediate forms and gradations rather than rigid types (source_locator:
    chapter p. 676 / ''Formen und Varianten des Nichtwissens'', section 3.1).'
  relationship_to_other_taxonomies_noted_by_source: Wehling explicitly frames his three dimensions as
    a response to, and improvement upon, prior typological attempts he names as Smithson (1989), Faber
    et al. (1992), and Kerwin (1993) (p. 676) — i.e., the source itself positions this scheme in implicit
    tension with Smithson's categorical approach. This is preserved here as documented tension, not resolved
    or merged.
  dimensions:
  - dimension_id: wehling.knowledge_of_nonknowledge
    name: Wissen über das Nichtwissen (Knowledge of the non-knowledge)
    source_locator: Wehling 2024, chapter p. 676 (section 3.1, first dimension)
    definition_operational: Differentiates non-knowledge by what and how much is known about what is not
      known. A person can know very precisely what they do not know (e.g. a colleague's exact birthdate)
      or can be entirely 'clueless' as to what escapes their knowledge.
    permitted_values:
    - value: known_unknowns
      label: Known unknowns (bekannt, was man nicht weiß)
      source_locator: p. 676, citing Kerwin 1993
    - value: unknown_unknowns
      label: Unknown unknowns (völlig ahnungslos)
      source_locator: p. 676, citing Kerwin 1993
    - value: intermediate_vague_or_partial
      label: Vague/partially-conscious non-knowledge (vage geahntes oder nur partiell bewusstes Nichtwissen)
      source_locator: 'p. 676: ''Dazwischen liegt ein breites Spektrum von unscharfen Übergangsformen'''
    source_vagueness: The source explicitly states this dimension is a spectrum with a 'wide range of
      blurred transitional forms' between the two poles, and does NOT provide criteria for distinguishing
      degrees of 'vagueness' within that middle range. Wehling notes the political volatility of the unknown-unknowns
      pole (citing its use to justify the 2003 Iraq war) as a reason the category resists neutral application.
    definition_confidence: medium
  - dimension_id: wehling.intentionality
    name: Intentionalität des Nichtwissens (Intentionality of the non-knowledge)
    source_locator: Wehling 2024, chapter p. 677 (section 3.1, second dimension)
    definition_operational: Differentiates non-knowledge by whether and to what degree it can be attributed
      to the action or omission of social actors. Explicitly NOT limited to explicit, conscious intent
      to not-know; also covers 'weaker' forms such as low epistemic interest or prematurely discontinued
      inquiry as socially attributable grounds for non-knowledge.
    permitted_values:
    - value: attributable_intentional
      label: Attributable / (at least weakly) intentional non-knowledge (zurechenbares Nicht-wissen-Wollen)
      source_locator: p. 677
    - value: weak_attributable
      label: Weakly attributable non-knowledge — low epistemic interest, prematurely abandoned inquiry
        (geringes Erkenntnisinteresse, vorschnell abgebrochene Erkenntnisbemühungen)
      source_locator: p. 677
    - value: unavoidable_non_attributable
      label: Unavoidable, non-attributable non-knowledge ('beim besten Willen' nicht vorhersehbar, weder
        vermeidbar noch schuldhaft zurechenbar)
      source_locator: p. 677
    source_vagueness: Wehling states directly that whether specific actors can be assigned legal, moral,
      or political responsibility for non-knowledge and its consequences is 'regularly highly contested'
      (per the secondary-corroborated 2006 elaboration; the 2024 chapter itself illustrates this only
      via the climate-change/greenhouse-effect historical example, pp. 677, without giving a decision
      rule).
    definition_confidence: medium
  - dimension_id: wehling.temporal_durability
    name: Zeitliche Dauerhaftigkeit des Nichtwissens (Temporal durability of the non-knowledge)
    source_locator: Wehling 2024, chapter p. 677 (section 3.1, third dimension)
    definition_operational: Differentiates non-knowledge by whether and over what time horizon it can
      (presumably) be converted into knowledge — ranging from a merely temporary 'not-yet-knowing' (Noch-nicht-Wissen)
      to a principled, insurmountable 'inability-to-know' (Nicht-wissen-Können / Niemals-wissen-Können),
      with many intermediate gradations (e.g. long-persisting but not fundamentally irresolvable non-knowledge).
    permitted_values:
    - value: not_yet_known
      label: Not-yet-knowing (Noch-nicht-Wissen) — temporary, presumed resolvable by research
      source_locator: p. 677
    - value: long_persisting_resolvable
      label: Long-persisting but not fundamentally unresolvable non-knowledge (lange anhaltendes, aber
        nicht grundsätzlich unauflösbares Nichtwissen)
      source_locator: p. 677
    - value: principled_unknowability
      label: Principled inability-to-know (prinzipiell unüberwindliches Nicht-wissen-Können / Niemals-wissen-Können)
      source_locator: p. 677
    source_vagueness: Wehling notes that Western-modern societies default to assuming all non-knowledge
      is eventually resolvable through targeted research, and that claims of principled unknowability
      are often dismissed as premodern/religious/metaphysical residue — yet he gives a concrete counter-example
      (practical infeasibility of testing all interactions among >100,000 industrially used chemical substances,
      citing Scheringer 2018, p. 677) as a case of research-practically (not metaphysically) grounded
      principled unknowability. No sharp operational boundary is given between 'long-persisting' and 'principled
      unknowability' beyond this illustrative case.
    definition_confidence: medium
