version: '0.1'
built_from:
- roberts_2013
- smithson_1989
- gross_2010
- wehling_2024
provenance_note: This codebook is constructed only from primary source literature and its secondary reception,
  per the RQ4 pre-registration protocol. It has not been adapted, broadened, or extended to fit software-engineering
  discourse; no SE examples, vocabulary, or category shaping have been introduced. Non-fit codes (RESIDUAL,
  NOT_NK, UNCODABLE) live in CODING_MANUAL.md, not in this file, since they are not imported taxonomy
  categories.
taxonomies:
- taxonomy_id: roberts_2013
  citation: 'Roberts, J. (2013). Organizational ignorance: Towards a managerial perspective on the unknown.
    Management Learning, 44(3), 215-236. https://doi.org/10.1177/1350507612443208'
  structure: categorical
  full_text_accessed: true
  access_note: Full text extracted directly from user-supplied PDF (22 pages), including Table 1 (pp.
    227-229).
  categories:
  - type_id: roberts.unknown_unknowns
    name: Unknown unknowns
    scope: imported
    source_locator: Roberts 2013, p. 218 (definition), pp. 219-220 (elaboration), p. 227 (Table 1)
    definition_source: A total, unrecognized absence of knowledge — the actor is not aware that the gap
      exists at all. Roberts imports this term from Gross (2007), Proctor (2008), and Witte et al. (2008),
      and links it to Smithson's (1989) notion of 'meta-ignorance'.
    definition_operational: Check whether the text unit expresses a gap in knowledge that the writer could
      not, at the time, have anticipated or named — i.e. a gap discoverable only in retrospect, once something
      unexpected has already happened.
    inclusion_criteria:
    - The unit describes a surprise, unanticipated event, or consequence that no one involved had foreseen
      or could plausibly have foreseen.
    - The unit is written in a retrospective/discovery frame ('we didn't realize until X happened that...')
      rather than a prospective frame ('we don't know whether...').
    exclusion_criteria:
    - The unit expresses a gap the writer explicitly names or anticipates in advance (that is a known
      unknown, not this).
    - The unit merely expresses uncertainty about a named, already-identified question.
    discriminating_questions:
    - question: Could the actor, at the time, have named what they did not know — even approximately?
      separates_from:
      - roberts.known_unknowns
    - question: Is the gap only visible in hindsight, after an unexpected event revealed it?
      separates_from:
      - roberts.errors
    source_examples:
    - Roberts notes unknown unknowns can arise from innovation itself, citing the unforeseen scale of
      consequences following Tim Berners-Lee's original World Wide Web proposal (Roberts 2013, p. 220).
    near_neighbours:
    - type_id: smithson.error
      relation: partial_overlap
      distinguishing_test: Smithson's 'error' (things you think you know but don't) presupposes a false
        belief; Roberts' unknown unknowns presuppose no belief at all, false or otherwise.
    - type_id: wehling.knowledge_of_nonknowledge
      relation: near_synonym
      distinguishing_test: NONE_POSSIBLE — Wehling's 'unknown unknowns' pole is explicitly the same Kerwin
        (1993)-derived concept Roberts also cites; both traditions converge on identical terminology and
        definition.
    source_vagueness: Roberts states this type of ignorance is 'beyond the anticipation and imagination'
      of the actor and can typically only be identified retrospectively (p. 220) — the source itself does
      not give any way to identify an unknown unknown prospectively, which is a structural property of
      the category, not an omission.
    definition_confidence: high
  - type_id: roberts.known_unknowns
    name: Known unknowns
    scope: imported
    source_locator: Roberts 2013, p. 218, pp. 220-221, p. 227 (Table 1)
    definition_source: Knowledge of the limits of one's own knowledge — the actor knows, with some specificity,
      what it is that it does not know.
    definition_operational: Check whether the unit names or points to a specific, identifiable gap in
      knowledge that the writer is aware of possessing.
    inclusion_criteria:
    - The unit explicitly identifies a specific question, fact, or piece of information the writer does
      not currently have.
    - The writer demonstrates awareness of the gap's existence, independent of whether it can ever be
      closed.
    exclusion_criteria:
    - The unit expresses ignorance of something the writer could not have named in advance (unknown unknown).
    - The unit expresses false confidence in something incorrect rather than an acknowledged gap (error).
    discriminating_questions:
    - question: Does the writer name or point to a specific fact/question they lack, rather than merely
        expressing general unease?
      separates_from:
      - roberts.unknown_unknowns
    - question: Is resolving the gap, in principle, only a matter of resource investment (time, money,
        effort) — as opposed to being structurally unresolvable regardless of resources?
      separates_from:
      - roberts.knowable_known_unknowns
    source_examples:
    - Roberts gives the anticipated possibility of a nuclear accident accompanying the development of
      a nuclear power plant as a known unknown — a recognized, named risk, prior to any accident occurring
      (Roberts 2013, p. 220, citing Chernobyl/Fukushima).
    near_neighbours:
    - type_id: roberts.knowable_known_unknowns
      relation: near_synonym
      distinguishing_test: Roberts distinguishes them only by resolvability given resources; no operational
        test for where the line falls is given in the source (source_vagueness applies).
    - type_id: wehling.knowledge_of_nonknowledge
      relation: near_synonym
      distinguishing_test: NONE_POSSIBLE — both traditions use the identical Kerwin (1993) 'known unknowns'
        concept.
    - type_id: smithson.uncertainty
      relation: partial_overlap
      distinguishing_test: Smithson's uncertainty concerns imprecision in information that IS present;
        Roberts' known unknowns concerns information that is entirely absent but whose absence is recognized.
    source_vagueness: None significant in the source; this is the most stable, uncontested category across
      the four traditions (see crosswalk).
    definition_confidence: high
  - type_id: roberts.knowable_known_unknowns
    name: Knowable known unknowns
    scope: imported
    source_locator: Roberts 2013, p. 218 (citing Congleton 2001, 'rational ignorance'), p. 222, p. 227
      (Table 1)
    definition_source: A known unknown that IS resolvable given sufficient motivation and resource investment
      — distinguished from a known unknown for which no amount of resources guarantees resolution.
    definition_operational: Check whether the unit frames a known gap as something the writer or others
      have deliberately chosen not to invest resources in closing (rather than as fundamentally unresolvable).
    inclusion_criteria:
    - The unit names a specific knowledge gap AND frames it as something that could be closed if resources/effort
      were invested.
    - There is an implicit or explicit statement that the gap persists because of a choice not to invest
      (delegation, outsourcing, deprioritization), rather than because closing it is impossible.
    exclusion_criteria:
    - The unit presents the gap as unresolvable in principle, regardless of resources (that is roberts.known_unknowns
      in its stricter/unresolvable sense, or wehling.temporal_durability's 'principled unknowability'
      pole).
    - There is no indication the gap could be closed with more resources.
    discriminating_questions:
    - question: Does the text suggest the gap could be closed with enough time/money/effort, and that
        not-closing it is a resource-allocation choice?
      separates_from:
      - roberts.known_unknowns
    source_examples:
    - Roberts frames specialization and outsourcing as organizational mechanisms that deliberately sustain
      knowable known unknowns in parts of an organization, so that cognitive capacities can be economized
      elsewhere (Roberts 2013, p. 222).
    near_neighbours:
    - type_id: roberts.known_unknowns
      relation: near_synonym
      distinguishing_test: NONE_POSSIBLE — Roberts gives no operational test for how much resource investment
        is required before a known unknown counts as 'knowable'; this is recorded as source_vagueness.
    source_vagueness: The boundary condition ('given sufficient motivation and resources') is asserted,
      not operationalised — Roberts does not specify a threshold or test.
    definition_confidence: medium
  - type_id: roberts.unknown_knowns
    name: Unknown knowns
    scope: imported
    source_locator: Roberts 2013, p. 218 (citing Witte et al. 2008, p. 253), p. 222, p. 227 (Table 1)
    definition_source: Failure to recognize knowledge that the actor already possesses, including tacit
      knowledge — the actor does not know that it knows.
    definition_operational: Check whether the unit describes knowledge or expertise that was already present
      (in a person, a document, a system) but was not recognized, used, or drawn upon until it was rediscovered
      or pointed out.
    inclusion_criteria:
    - The unit describes knowledge that existed (in a person, archive, system, or routine) prior to the
      point at which it is 'discovered' or used.
    - The failure is one of recognition/retrieval, not of possession — the knowledge was there all along.
    exclusion_criteria:
    - The unit describes knowledge that genuinely did not exist anywhere in the organization/community
      prior to the moment described (that is an absence-type category, not this).
    - The unit describes an active, deliberate concealment of known information (that is roberts.secrecy).
    discriminating_questions:
    - question: Did the knowledge already exist somewhere (a person's memory, a document, a system) before
        the moment being described, and was the 'problem' simply that nobody realized it was there?
      separates_from:
      - roberts.unknown_unknowns
      - roberts.known_unknowns
    source_examples:
    - Roberts notes that knowledge embedded in tacit routines or organizational archives may only be exposed
      in retrospect once the knowledge has been lost — e.g. when the person who maintained an archive
      retires and it becomes clear only then what the archive had contained (Roberts 2013, p. 222).
    near_neighbours:
    - type_id: roberts.unknown_unknowns
      relation: orthogonal
      distinguishing_test: Unknown knowns concern knowledge that objectively existed and was merely unrecognized;
        unknown unknowns concern the absence of knowledge that never existed in any accessible form.
    source_vagueness: Roberts quotes Polanyi's (1966) claim that 'all knowledge is tacitly understood,
      and therefore all knowing ultimately rests on an unknown known' (p. 222) — a universalizing move
      that, if taken literally, threatens to make the category apply to all knowledge everywhere, undermining
      its use as a discriminating code. This tension is left unresolved in the source.
    definition_confidence: medium
  - type_id: roberts.errors
    name: Errors
    scope: imported
    source_locator: Roberts 2013, p. 218 (citing Witte et al. 2008, p. 253, and Smithson 1989), pp. 222-223,
      pp. 227-228 (Table 1)
    definition_source: '''The things you think you know but don''t'' — a false belief held with confidence,
      arising from either distortion (confusion or inaccuracy, per Smithson) or bounded-rationality processing
      limits (Simon 1955).'
    definition_operational: Check whether the unit expresses or reveals a confident but factually incorrect
      belief — the writer (or someone described) believed something to be true/known that turns out to
      be false.
    inclusion_criteria:
    - The unit states or implies a belief held with confidence.
    - That belief is shown, or can be inferred, to be incorrect.
    exclusion_criteria:
    - The unit expresses awareness of not knowing something (that is a known/unknown-unknown, not an error
      — the actor here believes they DO know).
    - The unit describes a deliberate falsehood told to others (Roberts treats this as suppression-type
      ignorance, not error, which concerns the holder's own false belief).
    discriminating_questions:
    - question: Did the actor believe, with confidence, that something was true or known — and was that
        belief wrong?
      separates_from:
      - roberts.known_unknowns
      - roberts.unknown_unknowns
    source_examples:
    - Roberts's Table 1 notes error risk is elevated in 'non-standardized activity' (Roberts 2013, p.
      227-228 Table 1).
    near_neighbours:
    - type_id: smithson.error
      relation: conflicting
      distinguishing_test: NONE_POSSIBLE without disambiguation — Smithson's 'Error' is a broad top-level
        branch covering ALL passive-voice ignorance (including mere absence of information), whereas Roberts's
        'Errors' denotes specifically a false confident belief. Roberts imports Smithson's terminology
        but narrows its scope without flagging the narrowing; this is a direct terminological collision
        between the two taxonomies (see crosswalk).
    - type_id: smithson.distortion
      relation: near_synonym
      distinguishing_test: NONE_POSSIBLE — Roberts's 'Errors' is definitionally the outcome of what Smithson
        calls distortion (confusion/inaccuracy); Roberts explicitly cites Smithson for this.
    source_vagueness: Roberts's use of the word 'Errors' for a narrow concept (false confident belief),
      while Smithson uses the same word-family for his entire top-level 'Error' branch (which also includes
      mere incompleteness/absence), is a source-level terminological collision Roberts does not address.
    definition_confidence: high
  - type_id: roberts.taboos
    name: Taboos
    scope: imported
    source_locator: Roberts 2013, p. 218 (citing Witte et al. 2008), pp. 223-224, p. 228 (Table 1)
    definition_source: Socially constructed ignorance in the form of a social prohibition or ban on certain
      knowledge, often because it is viewed as dangerous or polluting.
    definition_operational: Check whether the unit refers to a topic being off-limits, forbidden, or prohibited
      from discussion/investigation because of a social, cultural, or organizational norm — not because
      the information is unavailable.
    inclusion_criteria:
    - The unit references a topic that is treated as socially or culturally off-limits, dangerous to discuss,
      or prohibited, independent of whether the underlying information itself is technically accessible.
    - The prohibition is attributable to a social norm, culture, or convention (of a group, organization,
      or wider society) rather than an individual psychological reaction.
    exclusion_criteria:
    - The unit describes an individual's personal, private avoidance of a painful truth without any wider
      social prohibition (that is roberts.denials).
    - The unit describes information being withheld for competitive/legal reasons without a taboo-like
      social prohibition attached (that is roberts.secrecy).
    discriminating_questions:
    - question: Is the topic avoided because a group/culture/organization treats it as forbidden or polluting
        to know or discuss — as opposed to one person finding it too painful to accept?
      separates_from:
      - roberts.denials
    source_examples: []
    near_neighbours:
    - type_id: roberts.denials
      relation: partial_overlap
      distinguishing_test: Roberts distinguishes taboo (externally/socially imposed prohibition) from
        denial (internal, individual/group psychological avoidance of painful knowledge via cognitive
        dissonance) — but gives no test for cases where both operate together (e.g. a socially-reinforced
        denial).
    source_vagueness: Roberts does not address the case where a taboo and a denial reinforce each other
      (a social prohibition that also serves individual psychological avoidance needs) — the source treats
      them as parallel, separately-caused categories without addressing their potential co-occurrence.
    definition_confidence: high
  - type_id: roberts.denials
    name: Denials
    scope: imported
    source_locator: Roberts 2013, p. 218 (citing Witte et al. 2008), pp. 224-225, p. 228 (Table 1)
    definition_source: The ignoring or repressing of knowledge that is too painful to accept, or that
      does not fit with one's current understanding of the world; the actor tolerates the resulting cognitive
      dissonance (Festinger 1957) rather than update their beliefs. Can occur at individual or group level
      (including organizational 'groupthink', Janis 1972).
    definition_operational: Check whether the unit shows a writer (or group) rejecting, minimizing, or
      refusing to accept information that conflicts with their existing beliefs, framed as psychologically
      or emotionally motivated rather than externally prohibited.
    inclusion_criteria:
    - Information that contradicts a currently-held belief is available to the actor, but the actor rejects,
      minimizes, or avoids updating on it.
    - The rejection is framed (explicitly or by clear implication) as motivated by discomfort, threat
      to identity/belief, or unwillingness to accept, rather than by external social prohibition.
    exclusion_criteria:
    - The rejection stems from an externally imposed social/organizational prohibition rather than internal
      psychological resistance (that is roberts.taboos).
    - The actor simply lacks the information rather than rejecting it once presented.
    discriminating_questions:
    - question: Was the conflicting information actually available/presented to the actor, and did they
        resist accepting it for psychological reasons?
      separates_from:
      - roberts.errors
      - roberts.known_unknowns
    source_examples: []
    near_neighbours:
    - type_id: roberts.taboos
      relation: partial_overlap
      distinguishing_test: See roberts.taboos entry — distinguished by locus of causation (social prohibition
        vs. individual/group psychological avoidance), but no test for combined cases.
    source_vagueness: None additional beyond the taboo/denial boundary noted above.
    definition_confidence: high
  - type_id: roberts.secrecy
    name: Secrecy
    scope: imported
    source_locator: Roberts 2013, pp. 225-226, p. 229 (Table 1)
    definition_source: Ignorance arising from the conscious suppression of knowledge, by individuals or
      organizations; an organization can be both the suppressor (e.g. trade secrets) and the target (subject
      to the secrecy of others, e.g. competitors, government).
    definition_operational: Check whether the unit describes information being deliberately withheld or
      concealed by an identifiable party (individual, group, organization), where the concealment is a
      strategic/unilateral act.
    inclusion_criteria:
    - Information is deliberately withheld, concealed, or restricted from a party by another identifiable
      party.
    - The withholding serves a strategic, competitive, or protective purpose for the withholding party.
    exclusion_criteria:
    - The restriction is about information concerning the withholding party's own person or private sphere,
      sanctioned reciprocally by social/legal norms (that is roberts.privacy — Roberts's 'multilateral'
      distinction).
    - The information is simply unavailable/absent rather than actively concealed by anyone.
    discriminating_questions:
    - question: Is there an identifiable party actively withholding the information from another, as a
        strategic act (as opposed to a general socially-sanctioned right to restrict access to oneself)?
      separates_from:
      - roberts.privacy
    source_examples:
    - Roberts gives trade secrets and discriminatory practices as examples of strategically valuable secrecy
      (Roberts 2013, p. 229, Table 1).
    near_neighbours:
    - type_id: roberts.privacy
      relation: near_synonym
      distinguishing_test: Roberts's own distinguishing criterion is that privacy is 'multilateral in
        nature' (a reciprocally recognized right) while secrecy is unilateral/strategic — this is asserted
        but not further operationalised with an independent test beyond the label itself.
    source_vagueness: Roberts's 'multilateral' vs. unilateral distinction between secrecy and privacy
      is stated once (p. 223) without elaboration on borderline cases (e.g. a mutually agreed non-disclosure
      arrangement between two parties, which is arguably both multilateral and strategic).
    definition_confidence: high
  - type_id: roberts.privacy
    name: Privacy
    scope: imported
    source_locator: Roberts 2013, pp. 226-227, p. 229 (Table 1)
    definition_source: Ignorance arising from an individual's or group's ability to restrict others' access
      to themselves or to information about themselves; described as 'multilateral in nature' and typically
      sanctioned by social norms, organizational policy, or law.
    definition_operational: Check whether the unit describes a person or group's socially/legally sanctioned
      right to withhold information specifically about themselves, rather than a strategic act of withholding
      information about something external.
    inclusion_criteria:
    - The withheld information concerns the withholding party's own person, identity, or personal circumstances.
    - The withholding is framed as a sanctioned right (social norm, policy, or law) rather than a unilateral
      strategic choice.
    exclusion_criteria:
    - The withheld information concerns something other than the withholding party's own person (that
      is roberts.secrecy).
    - The withholding is framed as a strategic/competitive act rather than an exercise of a recognized
      right.
    discriminating_questions:
    - question: Is the withheld information specifically about the withholding party's own person, and
        is the withholding recognized/sanctioned as a right rather than a strategic maneuver?
      separates_from:
      - roberts.secrecy
    source_examples: []
    near_neighbours:
    - type_id: roberts.secrecy
      relation: near_synonym
      distinguishing_test: See roberts.secrecy — Roberts's own test ('multilateral' character) is asserted
        rather than independently operationalised.
    source_vagueness: As with secrecy, the 'multilateral' criterion is not elaborated with a concrete
      decision procedure.
    definition_confidence: medium
- taxonomy_id: smithson_1989
  citation: 'Smithson, M. (1989). Ignorance and Uncertainty: Emerging Paradigms. New York: Springer-Verlag.
    Companion article: Smithson, M. (1993). Ignorance and science: Dilemmas, perspectives, and prospects.
    Knowledge: Creation, Diffusion, Utilization, 15(2), 133-156.'
  structure: categorical
  full_text_accessed: false
  access_note: 'Neither primary source was accessed in full. (1) Smithson 1993 ''Ignorance and Science''
    (doi 10.1177/107554709301500202): fetch_article_fulltext returned oa_status=''closed'' -- Unpaywall,
    Semantic Scholar, PMC, and CrossRef TDM all reported no open-access location; only the abstract was
    retrievable. (2) Smithson 1989 book: not accessed as a complete text, but a digitized excerpt (apparently
    OCR''d from the book''s opening chapter, including an inline page-break marker ''8'' and a garbled
    rendering of the book''s Figure 1.1 tree diagram) was found hosted at vdoc.pub and is treated below
    as a primary-text fragment for the passages it contains (distortion, incompleteness/absence/uncertainty).
    In addition, the taxonomy was corroborated via: (a) Michael Smithson''s own first-person restatement
    of the taxonomy published in 2022 (i2insights.org / RealKM), which gives verbatim definitions and
    examples for irrelevance, untopicality, taboo, undecidability, ambiguity, and vagueness in his own
    words (a tertiary but author-authored source, not the 1989/1993 originals); (b) a co-authored later
    book chapter by Smithson (''Understanding Uncertainty'', ANU Press, in Bammer et al. context) that
    restates the distortion/incompleteness split and explicitly cites back to Smithson 1989; and (c) multiple
    independent secondary/tertiary sources (an ''Agnocracy'' journal article, a 2019 Synthese article
    on negative expertise, a Springer book chapter ''Do We Get to Know the Unknown?'') that all converge
    on the same tree structure. No independent source supplied a definition of ''probability'' as an ignorance-type
    in Smithson''s own words -- the 1989 excerpt itself explicitly defers detailed treatment of probability/vagueness/ambiguity
    at the point where it lists them (''I will delay further dissection of this part of the typology for
    now''). Exact 1989 page numbers could only be pinned down for two points: p.9 for the overall Error/Irrelevance
    diagram (per a secondary source''s citation) and p.8, inferred from an inline OCR page marker in the
    vdoc.pub excerpt, for the incompleteness/absence/uncertainty passage. All other page numbers are UNVERIFIED
    against the original book.'
  categories:
  - type_id: smithson.error
    name: Error
    scope: imported
    parent: null
    source_locator: Smithson 1989, p. 9 (per secondary citation, UNVERIFIED against original pagination)
    definition_source: 'Faithful paraphrase, no SE framing. One of two top-level branches of ignorance:
      the ''passive voice'' / state of ignorance — being ignorant of something, as distinct from deliberately
      ignoring it. Subdivided into distortion and incompleteness.'
    definition_operational: Use only as a ROOT/branch code if a coder needs a coarse pass; in practice
      coders should code at the leaf level (distortion/confusion/inaccuracy/incompleteness/absence/uncertainty/probability/vagueness/ambiguity)
      — this branch node is retained for T1 completeness and crosswalk purposes, not as a primary coding
      target.
    inclusion_criteria:
    - The unit expresses a state of not-knowing that the actor did not choose or actively bring about
      (contrast with irrelevance, an active avoidance).
    exclusion_criteria:
    - The unit expresses a deliberate, active avoidance of a topic (that is smithson.irrelevance).
    discriminating_questions:
    - question: Is the ignorance something that happened TO the actor (a state), or something the actor
        actively brought about by not attending to a matter (an act)?
      separates_from:
      - smithson.irrelevance
    source_examples: []
    near_neighbours:
    - type_id: roberts.errors
      relation: conflicting
      distinguishing_test: NONE_POSSIBLE without disambiguation — see roberts.errors near_neighbours entry;
        Roberts narrows Smithson's broad branch label to a specific 'false confident belief' meaning.
    source_vagueness: Smithson's own ordinary-language term ('error' = a mistake) is narrower than his
      technical use of the term as the label for the entire passive-ignorance branch (which includes mere
      absence of information, not just mistaken belief) — a self-acknowledged terminological tension per
      the secondary source characterizing this branch.
    definition_confidence: medium
  - type_id: smithson.irrelevance
    name: Irrelevance
    scope: imported
    parent: null
    source_locator: Smithson 1989, p. 9 (per secondary citation); definition restated by Smithson in his
      own words in a 2022 essay
    definition_source: 'The other top-level branch: the ''active voice'' / act of ignorance — deliberately
      not attending to, excluding, or ignoring matters, in contrast with simply lacking knowledge of them.
      Subdivided into untopicality, taboo, and undecidability.'
    definition_operational: Root/branch node; coders should code at the leaf level (untopicality/taboo/undecidability).
    inclusion_criteria:
    - The unit shows the actor treating a matter as not worth attending to, out of bounds, or not a live
      question — an active exclusion rather than a passive gap.
    exclusion_criteria:
    - The unit expresses a passive state of not-knowing with no element of active exclusion (that is smithson.error).
    discriminating_questions:
    - question: Is the actor actively treating the matter as something to disregard, exclude, or not pursue
        — rather than simply lacking information about it?
      separates_from:
      - smithson.error
    source_examples: []
    near_neighbours:
    - type_id: roberts.knowable_known_unknowns
      relation: partial_overlap
      distinguishing_test: Roberts's category concerns a resource-allocation choice not to invest in closing
        a KNOWN gap; Smithson's irrelevance concerns a broader active-exclusion stance that need not involve
        a named, resource-tradeoff-framed gap. No sharp test is given by either source for intermediate
        cases.
    source_vagueness: Smithson's own gloss ('avoiding things we believe that we don't need or want to
      know or that we shouldn't know') bundles at least three distinct motivational stances (don't need
      / don't want / shouldn't) under one label; these are only disambiguated at the level of the three
      subtypes, not at this branch level.
    definition_confidence: medium-high
  - type_id: smithson.distortion
    name: Distortion
    scope: imported
    parent: smithson.error
    source_locator: Smithson 1989 (exact page UNVERIFIED); restated verbatim by Smithson in a later co-authored
      chapter ('Understanding Uncertainty', ANU Press)
    definition_source: 'The branch of error arising from wrongly-formed knowledge (as opposed to missing
      knowledge): ''a systematic bias or inaccuracy ... or confusion (mistaking one thing for another)''.
      Dichotomized into inaccuracy (distortion in degree) and confusion (wrongful substitution in kind).'
    definition_operational: Check whether the unit expresses a belief or claim that is present but WRONG
      in form (misidentified or mis-estimated), as opposed to simply missing.
    inclusion_criteria:
    - A specific claim or belief is present in the unit.
    - That claim/belief is, or is shown to be, incorrect in its content (not merely uncertain in confidence).
    exclusion_criteria:
    - The unit expresses missing information rather than a wrong claim (that is smithson.incompleteness).
    discriminating_questions:
    - question: Is there a specific, present claim that is wrong (distortion), or is information simply
        absent/imprecise (incompleteness)?
      separates_from:
      - smithson.incompleteness
    - question: Is the error one of mistaking one thing for another in kind (confusion), or a matter of
        degree/magnitude (inaccuracy)?
      separates_from:
      - smithson.confusion
      - smithson.inaccuracy
    source_examples: []
