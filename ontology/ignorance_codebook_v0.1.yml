    - The unit makes a claim about the boundary or limits of what can be known on a topic, not merely
      that something is currently unknown.
    exclusion_criteria:
    - The unit frames the gap as resolvable given effort/investigation (that is gross.non_knowledge).
    discriminating_questions:
    - question: Does the unit claim the gap is IN PRINCIPLE unresolvable (negative knowledge), or merely
        not yet resolved (non-knowledge)?
      separates_from:
      - gross.non_knowledge
    source_examples: []
    near_neighbours:
    - type_id: wehling.temporal_durability
      relation: near_synonym
      distinguishing_test: NONE_POSSIBLE — both concern principled/irreducible unresolvability of an unknown;
        without page-verified primary text for Gross's own wording, the two cannot be independently distinguished
        beyond noting they derive from different theoretical lineages (Knorr-Cetina via Gross vs. Wehling's
        own dimension).
    source_vagueness: Because 'negative knowledge' is explicitly a borrowed term (from Knorr-Cetina, not
      coined by Gross), the available secondary material does not clarify exactly how much Gross's own
      usage diverges from Knorr-Cetina's, nor what page-level definition appears in the 2010 book specifically
      as opposed to the 2007 article.
    definition_confidence: low
  - type_id: gross.nescience
    name: Nescience
    scope: imported
    source_locator: Gross 2010, p. 68 (per secondary citation); Gross 2010, p. 76 (verbatim quote reproduced
      in a book review)
    definition_source: A citing work paraphrases Gross (2010, p. 68) as understanding nescience as 'the
      complete absence of knowledge', placing it categorically outside the non-knowledge/negative-knowledge
      mapping — i.e. it is not itself a specifiable or nameable unknown. The same source paraphrases (without
      page cite) that actors can become aware of a nescience only in hindsight, at best. A 2011 American
      Journal of Sociology book review reproduces a verbatim sentence from p. 76 linking nescience to
      the retrospective revelation, via surprise, of an error.
    definition_operational: Check whether the unit describes a gap that was not just unresolved but entirely
      un-nameable beforehand — discovered only retrospectively, typically via an unexpected event or outcome
      that revealed the gap after the fact.
    inclusion_criteria:
    - 'The unit is written in a retrospective/discovery frame: a gap becomes visible only once an unexpected
      outcome has already occurred.'
    - Before that outcome, there is no indication anyone could have named or anticipated the gap.
    exclusion_criteria:
    - The gap was named or anticipated in advance in some form (that is gross.non_knowledge).
    discriminating_questions:
    - question: Could this gap have been named or anticipated by anyone before the surprising outcome
        occurred?
      separates_from:
      - gross.non_knowledge
    source_examples: []
    near_neighbours:
    - type_id: roberts.unknown_unknowns
      relation: near_synonym
      distinguishing_test: NONE_POSSIBLE — both denote a total, retrospectively-discovered absence of
        knowledge with no prior awareness; terminological overlap with Roberts's 'unknown unknowns' appears
        near-total based on available (secondary) description of Gross's usage.
    - type_id: gross.surprise
      relation: partial_overlap
      distinguishing_test: Per the p. 76 quote, surprise is the triggering EVENT/PROCESS through which
        a nescience is revealed; nescience is the underlying gap itself. A unit describing the triggering
        event vs. the gap it reveals may need both codes or a judgment call about which is foregrounded.
    source_vagueness: The p. 68 definition is itself a secondary paraphrase, not a verbatim quote, so
      the exact wording Gross uses on that page is unconfirmed. One citing source further notes nescience
      carries a distinct theological/medieval lineage ('absolute or intransitive ignorance') that Gross
      repurposes rather than originates — a shift in meaning from the term's historical usage that introduces
      some definitional slippage.
    definition_confidence: medium
  - type_id: gross.surprise
    name: Surprise
    scope: imported
    source_locator: Gross 2010, p. 1 (quote reproduced identically across multiple secondary sources)
    definition_source: 'The book''s opening line, quoted identically by the publisher (MIT Press/Amazon
      jacket copy) and by a secondary academic chapter with an explicit page citation: "Ignorance and
      surprise belong together" (p. 1). Surprises can make actors aware of their own prior ignorance;
      an event that defies prediction or risk assessment is treated as a potential route to new, previously
      non-knowledge/nescient content.'
    definition_operational: Check whether the unit describes an outcome or event that was unexpected/defied
      prediction, and whether that event is framed as the moment a prior gap in knowledge became visible.
    inclusion_criteria:
    - An event or outcome is described as unexpected, unpredicted, or defying prior risk assessment.
    - The event is framed (explicitly or by clear implication) as revealing something that was not known
      before.
    exclusion_criteria:
    - The unit describes an expected, predicted outcome (no element of surprise).
    - The unit describes the underlying gap itself without reference to a triggering event (that is closer
      to gross.nescience or gross.non_knowledge).
    discriminating_questions:
    - question: Is the focus on the triggering unexpected EVENT itself (surprise), or on the underlying
        GAP the event revealed (nescience/non-knowledge)?
      separates_from:
