- taxonomy_id: gross_2010
  citation: 'Gross, M. (2010). Ignorance and Surprise: Science, Society, and Ecological Design. MIT Press.'
  structure: categorical
  full_text_accessed: false
  access_note: 'The 2010 MIT Press book could not be retrieved in full text through any available channel
    (no open-access location found via Unpaywall/Semantic Scholar/PMC/CrossRef-TDM; MIT Press direct.mit.edu
    and mitpress.mit.edu landing pages return only the publisher blurb and jacket endorsements, not chapter
    text). The book''s designated conceptual predecessor, Gross, M. (2007) ''The Unknown in Process: Dynamic
    Connections of Ignorance, Non-knowledge and Related Concepts'', Current Sociology 55(5): 742-759,
    was also NOT retrievable in full text (closed access; only its abstract was obtained). NOTE: the DOI
    supplied in the task instructions, 10.1177/0011392107077645, does not resolve in CrossRef at all;
    the correct DOI for this article, found via web search, is 10.1177/0011392107079928 -- fetch_article_fulltext
    was retried against the correct DOI and still failed to obtain full text (closed access, no TDM link,
    no PMC/OA copy). Consequently every category below is reconstructed exclusively from secondary sources:
    (1) a plain-language explainer of Gross (2007)''s ''house of the unknown'' scheme written by Michael
    Smithson (i2insights.org, 2022), a named ignorance-studies scholar, describing ''ignorance'', ''nonknowledge'',
    and ''negative knowledge'' as used by Gross (2007) -- this is a secondary paraphrase of the 2007 article,
    not the article itself, and carries no page numbers; (2) a book review of the 2010 book in American
    Journal of Sociology 116(6) (2011): 2022-2024, which reproduces one verbatim quoted sentence from
    the book at p. 76 concerning surprise, error, and ''nescience''; (3) a citing academic work (ResearchGate
    record 346624361) that quotes Gross (2010: 68) defining ''nescience'' as ''the complete absence of
    knowledge'' and states it lies ''outside the mapping'' of the other terms, and additionally paraphrases
    (without page cite) that nescience is a retrospective/hindsight-only category; (4) a book chapter
    on agnotology (Springer, ''Agnotology: Ignorance and Absence...'') that paraphrases Gross (2010) as
    clarifying Merton''s (1987) ''specified ignorance'' via the terms nescience, non-knowledge, and negative
    knowledge, and quotes the book''s opening line ''Ignorance and surprise belong together'' at p. 1
    -- this quote is corroborated verbatim by the MIT Press and Amazon publisher blurbs for the book,
    though those do not carry a page number themselves. No source accessed provided a systematic, page-referenced
    walkthrough of the full 2010 category structure (e.g., whether nescience/non-knowledge/negative knowledge
    form an explicit diagrammed typology in the book, and how/whether the 2007 ''house of the unknown''
    diagram is carried over unchanged). The task brief''s suggested terms ''active non-knowledge'' vs
    ''passive non-knowledge'' were NOT found anywhere in the retrieved literature as Gross''s own labels;
    this pairing is treated as unverified and is NOT included as a category (see unverifiable_claims).'
