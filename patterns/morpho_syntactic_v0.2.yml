# patterns/morpho_syntactic_v0.2.yml
#
# Successor to morpho_syntactic_v0.1.yml. See MARKER_REVIEW.md §§2,4 for rationale.
#
# SCHEMA EXTENSION (backward-compatible):
#   type: "Matcher"           → token pattern, as v0.1 (unchanged behaviour).
#   type: "DependencyMatcher" → pattern is a list of node specs with RIGHT_ID/
#                               REL_OP/LEFT_ID (spaCy DependencyMatcher). Encodes
#                               SCOPE: the cue only fires in the right grammatical
#                               relation. This is the fix for the cue≠scope problem.
#                               A rule may instead supply `patterns:` — a list of
#                               such node lists — when one cue has several
#                               grammatical realisations. `pattern:` (singular) 
#                               remains valid and is the common case.
#   weight  : float [0,1]  — analysis-time confidence.
#   status  : active | candidate.
# A loader that predates this schema can skip DependencyMatcher rules and still
# run every Matcher rule → nothing v0.1 did is lost.
#
# Literature grounding (0.2.2 — journal papers preferred; full references below):
#   Negation (scoped)  → Vincze et al. 2008; Morante & Sporleder 2012; Helmer et al. 2016
#   Not-knowing verbs  → Bongelli et al. 2019, 2023; Zuczkowski & Stemberger 2024 (KUB);
#                        Rubin 2007, 2010; Weatherall 2011
#   Shields            → Prince et al. 1982; Salager-Meyer 1994; Hyland 1996;
#                        Thompson & Mulac 1991; Kärkkäinen 2006
#   Modality           → Hyland 1996, 2005; Vold 2006; Morante & Sporleder 2012; Marshman 2008
#   Hedging adverbials → Lakoff 1973; Szarvas et al. 2012
#   Evidentiality      → Aikhenvald 2004; Aijmer 2009; San Roque et al. 2017
#   Tense              → Janich 2020; Bongelli et al. 2019 (epistemic future)
#   Syntactic/Q        → Bongelli et al. 2018; Riccioni et al. 2018; San Roque et al. 2017
#   Adversative        → Simon 2020 (UNRESOLVED — full reference needed)
#
# References:
#   - Aijmer (2009). Seem and evidentiality. Functions of Language 16(1), 63–88. doi:10.1075/fol.16.1.05aij
#   - Aikhenvald (2004). Evidentiality. Oxford University Press. [category definition]
#   - Bongelli, Riccioni, Burro & Zuczkowski (2019). Writers’ uncertainty in scientific and popular biomedical articles. A comparative analysis of the British Medical Journal and Discover Magazine. PLOS ONE 14(9), e0221933. doi:10.1371/journal.pone.0221933
#   - Bongelli, Riccioni, Vincze & Zuczkowski (2018). Questions and epistemic stance: Some examples from Italian conversations. Ampersand 5, 29–44. doi:10.1016/j.amper.2018.11.001
#   - Bongelli, Zuczkowski & Riccioni (2023). The Italian Epistemic Disclaimer Non so [I Don’t Know] in a Corpus of Gynaecological Interactions. Languages 8(4), 226. doi:10.3390/languages8040226
#   - Helmer, Reineke & Deppermann (2016). A range of uses of negative epistemic constructions in German: ICH WEIß NICHT as a resource for dispreferred actions. Journal of Pragmatics 106, 97–114. doi:10.1016/j.pragma.2016.06.002
#   - Hyland (1996). Writing Without Conviction? Hedging in Science Research Articles. Applied Linguistics 17(4), 433–454. doi:10.1093/applin/17.4.433
#   - Hyland (2005). Stance and engagement: a model of interaction in academic discourse. Discourse Studies 7(2), 173–192. doi:10.1177/1461445605050365
#   - Janich (2020). Wissenschaftliches Nichtwissen in Text und Diskurs – linguistische Perspektiven. Wissenschaftsreflexion, 45–68. doi:10.30965/9783957437372_004
#   - Kärkkäinen (2006). Stance taking in conversation: From subjectivity to intersubjectivity. Text &amp; Talk - An Interdisciplinary Journal of Language, Discourse Communication Studies 26(6), 699–731. doi:10.1515/text.2006.029
#   - Lakoff (1973). Hedges: A study in meaning criteria and the logic of fuzzy concepts. Journal of Philosophical Logic 2(4). doi:10.1007/bf00262952
#   - Marshman (2008). Expressions of uncertainty in candidate knowledge-rich contexts: A comparison in English and French specialized texts. Terminology 14(1), 124–151. doi:10.1075/term.14.1.07mar
#   - Morante & Sporleder (2012). Modality and Negation: An Introduction to the Special Issue. Computational Linguistics 38(2), 223–260. doi:10.1162/coli_a_00095
#   - Prince, Frader & Bosk (1982). On hedging in physician-physician discourse. In R. J. Di Pietro (ed.), Linguistics and the Professions, 83–97. Ablex. [no paper version]
#   - Riccioni, Bongelli, Philip & Zuczkowski (2018). Dubitative questions and epistemic stance. Lingua 207, 71–95. doi:10.1016/j.lingua.2018.03.001
#   - Rubin (2007). Stating with certainty or stating with doubt: intercoder reliability results for manual annotation of epistemically modalized statements. Human Language Technologies 2007: The Conference of the North American Chapter of the Association for Computational Linguistics; Companion Volume, Short Papers on XX - NAACL ’07, 141–144. doi:10.3115/1614108.1614144
#   - Rubin (2010). Epistemic modality: From uncertainty to certainty in the context of information seeking as interactions with texts. Information Processing &amp; Management 46(5), 533–540. doi:10.1016/j.ipm.2010.02.006
#   - Salager-Meyer (1994). Hedges and textual communicative function in medical English written discourse. English for Specific Purposes 13(2), 149–170. doi:10.1016/0889-4906(94)90013-2
#   - San Roque, Floyd & Norcliffe (2017; online 2015). Evidentiality and interrogativity. Lingua 186-187, 120–143. doi:10.1016/j.lingua.2014.11.003
#   - Simon & Janich (2023). Konstitution von Nichtwissen und Unsicherheit im Sprachgebrauch – ein programmatischer Systematisierungsversuch. Fachsprache 45(1-2), 5–27. doi:10.24989/fs.v45i1-2.2235
#   - Szarvas, Vincze, Farkas, Móra & Gurevych (2012). Cross-Genre and Cross-Domain Detection of Semantic Uncertainty. Computational Linguistics 38(2), 335–367. doi:10.1162/coli_a_00098
#   - Thompson & Mulac (1991). The discourse conditions for the use of the complementizer that in conversational English. Journal of Pragmatics 15(3), 237–251. doi:10.1016/0378-2166(91)90012-m
#   - Vincze, Szarvas, Farkas, Móra & Csirik (2008). The BioScope corpus: biomedical texts annotated for uncertainty, negation and their scopes. BMC Bioinformatics 9(S11). doi:10.1186/1471-2105-9-s11-s9
#   - Vold (2006). Epistemic modality markers in research articles: a cross‐linguistic and cross‐disciplinary study. International Journal of Applied Linguistics 16(1), 61–87. doi:10.1111/j.1473-4192.2006.00106.x
#   - Weatherall (2011). <i>I don’t know</i> as a Prepositioned Epistemic Hedge. Research on Language and Social Interaction 44(4), 317–337. doi:10.1080/08351813.2011.619310
#   - Zuczkowski & Stemberger (2024). When clients (or psychotherapists) say I don’t know: unknowledge or uncertainty?. Gestalt Theory 46(2-3), 315–334. doi:10.2478/gth-2024-0022
# ─────────────────────────────────────────────────────────────────────────────

version: "0.2"

patterns:

  # --- EPISTEMIC VERBS OF NOT-KNOWING / negation/interrogative --------------
  - id: "morph.epi.neg_cognition"
    layer: "morpho_syntactic"
    category: "epistemic_verb"
    subcategory: "not_knowing"
    source: "Bongelli et al. 2023; Zuczkowski & Stemberger 2024 (KUB); Rubin 2007; Helmer et al. 2016; Weatherall 2011"
    #weight: 1.0
    status: "active"
    type: "DependencyMatcher"
    pattern:
      - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: {IN: ["know", "understand", "tell", "figure", "grasp", "recall", "remember", "get", "follow", "comprehend"]}}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "neg", RIGHT_ATTRS: {DEP: "neg"}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "subj", RIGHT_ATTRS: {LOWER: {IN: ["i", "we"]}, DEP: "nsubj"}}

  - id: "morph.epi.neg_cognition_modal"
    layer: "morpho_syntactic"
    category: "epistemic_verb"
    subcategory: "not_knowing"
    note: "'can't tell / couldn't figure out' — modal + negated cognition verb."
    source: "KUB; Rubin 2007"
    #weight: 1.0
    status: "active"
    type: "DependencyMatcher"
    pattern:
      - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: {IN: ["tell", "figure", "know", "say", "determine", "explain", "understand"]}}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "aux", RIGHT_ATTRS: {LOWER: {IN: ["ca", "could", "can", "would"]}, TAG: "MD"}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "neg", RIGHT_ATTRS: {DEP: "neg"}}

  - id: "morph.epi.neg_cognition_ascribed"
    layer: "morpho_syntactic"
    category: "epistemic_verb"
    subcategory: "not_knowing_ascribed"
    note: >
      0.2.2 NEW. Negated know/understand with a NON-1st-person subject ("users
      don't know", "you can't understand"): NK attributed to others. Previously
      only caught (unscoped, unlabelled) by lex.dont_know. Separate subcategory
      so that self-attributed NK (KUB 'Unknowing') and NK attributed to others
      are never pooled; attribution typing cf. Simon & Janich 2023 (to be
      checked against the full text). Candidate until validated — generic
      'you never know' is a known false-positive class.
    source: "Simon & Janich 2023 (attribution types; verify)"
    status: "candidate"
    type: "DependencyMatcher"
    pattern:
      - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: {IN: ["know", "understand", "realize", "realise"]}}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "neg", RIGHT_ATTRS: {DEP: "neg"}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "subj", RIGHT_ATTRS: {LOWER: {NOT_IN: ["i", "we"]}, DEP: "nsubj"}}


  # --- PLAUSIBILITY/ATTRIBUTION SHIELDS -----------------------------------------------
  - id: "morph.hedge.shield_think"
    layer: "morpho_syntactic"
    category: "hedging"
    subcategory: "plausibility_shield"
    note: "'I think/believe/guess/suppose (that) …' — only when 1st-person and governing a clause."
    source: "Prince et al. 1982; Salager-Meyer 1994; Hyland 1996; Thompson & Mulac 1991; Kärkkäinen 2006"
    #weight: 0.8
    status: "active"
    type: "DependencyMatcher"
    # 0.2.2: sole owner of plausibility shields (lex.guess_v/suppose_v/assume_v/
    # suspect_v/reckon_v demoted). Two realisations added so the lexical
    # coverage is not lost: (2) pro-form 'so', (3) 'suspect' + NP object.
    patterns:
      # (1) 1st-person cognition verb governing a clause ("I guess the cache is stale", "It works, I guess")
      - - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: {IN: ["think", "believe", "guess", "suppose", "assume", "suspect", "reckon", "imagine"]}, POS: "VERB"}}
        - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "subj", RIGHT_ATTRS: {LOWER: "i", DEP: "nsubj"}}
        - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "comp", RIGHT_ATTRS: {DEP: {IN: ["ccomp", "xcomp", "acomp"]}}}
      # (2) pro-form complement ("I think so", "I guess so", "I suppose so")
      - - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: {IN: ["think", "believe", "guess", "suppose", "reckon", "assume"]}, POS: "VERB"}}
        - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "subj", RIGHT_ATTRS: {LOWER: "i", DEP: "nsubj"}}
        - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "so", RIGHT_ATTRS: {LOWER: "so", DEP: "advmod"}}
      # (3) 'suspect' + nominal object ("I suspect a race condition"). Restricted to
      #     suspect: NP objects of believe/assume/imagine are mostly non-epistemic
      #     ("I believe you", "I assume responsibility").
      - - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: "suspect", POS: "VERB"}}
        - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "subj", RIGHT_ATTRS: {LOWER: "i", DEP: "nsubj"}}
        - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "obj", RIGHT_ATTRS: {DEP: "dobj"}}

  - id: "morph.hedge.shield_asfaras"
    layer: "morpho_syntactic"
    category: "hedging"
    subcategory: "attribution_shield"
    note: "'as far as I know/can tell/am aware' — fixed shield frame."
    source: "Prince et al. 1982; Salager-Meyer 1994"
    #weight: 0.85
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: "as"}
      - {LOWER: "far"}
      - {LOWER: "as"}
      - {LOWER: {IN: ["i", "we"]}}

  # --- EVIDENTIALS (Combined in the paper; just one category) ---------------
  - id: "morph.evid.inferential_seem"
    layer: "morpho_syntactic"
    category: "evidential"
    subcategory: "inferential"
    note: "seem/appear/look/sound = inference from appearance (was mislabelled quasi_modal in v0.1)."
    source: "Aikhenvald 2004; Aijmer 2009; Vold 2006"
    #weight: 0.75
    status: "active"
    type: "Matcher"
    pattern:
      - {LEMMA: {IN: ["seem", "appear", "look", "sound"]}, POS: "VERB"}

  - id: "morph.evid.inferential_suggest"
    layer: "morpho_syntactic"
    category: "evidential"
    subcategory: "inferential"
    note: "suggest/indicate/imply = reporting an inference (was quasi_modal in v0.1). 'tend' dropped (C-7)."
    source: "Aikhenvald 2004; Hyland 1996"
    #weight: 0.6
    status: "active"
    type: "Matcher"
    pattern:
      - {LEMMA: {IN: ["suggest", "indicate", "imply"]}, POS: "VERB"}

  # --- MODALITY --------------------------------------------------------------
  - id: "morph.mod.epistemic_maymight"
    layer: "morpho_syntactic"
    category: "modality"
    subcategory: "epistemic"
    note: "may/might: clearest epistemic possibility modals."
    source: "Hyland 1996; Vold 2006"
    #weight: 0.8
    status: "active"
    type: "Matcher"
    pattern:
      - {TAG: "MD", LOWER: {IN: ["may", "might"]}}

  - id: "morph.mod.epistemic_must_be"
    layer: "morpho_syntactic"
    category: "modality"
    subcategory: "epistemic"
    note: "Epistemic 'must' (inferential certainty): 'that must be why' — must + be/have. Distinct from deontic must."
    source: "Hyland 1996; Morante & Sporleder 2012"
    #weight: 0.7
    status: "active"
    type: "Matcher"
    pattern:
      - {TAG: "MD", LOWER: "must"}
      - {LEMMA: {IN: ["be", "have"]}}

  - id: "morph.mod.epistemic_will_predict"
    layer: "morpho_syntactic"
    category: "modality"
    subcategory: "epistemic_prediction"
    note: "Predictive will/'ll — epistemic projection into the future. Missing in v0.1."
    source: "Hyland 1996; Bongelli et al. 2019 (epistemic future)"
    #weight: 0.5
    status: "candidate"
    type: "Matcher"
    pattern:
      - {TAG: "MD", LOWER: {IN: ["will", "'ll", "ll"]}}

  - id: "morph.mod.underspecified_cancould"
    layer: "morpho_syntactic"
    category: "modality"
    subcategory: "underspecified"
    note: >
      can/could/would: polysemous (ability/root-possibility/conditional dominate
      over epistemic). Kept as LOW-WEIGHT underspecified per C-1, not asserted epistemic.
      Demoted active→candidate (2026-10-03): as a bare Matcher it fires on every
      can/could/would, so it must not count toward active NK headline rates.
    source: "Hyland 1996; Vold 2006 (see MARKER_REVIEW C-1)"
    #weight: 0.2
    status: "candidate"
    type: "Matcher"
    pattern:
      - {TAG: "MD", LOWER: {IN: ["can", "could", "would"]}}

  - id: "morph.mod.deontic"
    layer: "morpho_syntactic"
    category: "modality"
    subcategory: "deontic"
    note: "Obligation/necessity — often flags an acknowledged gap. 'must' handled separately for epistemic reading."
    source: "Hyland 1998; Marshman 2008"
    #weight: 0.4
    status: "candidate"
    type: "Matcher"
    pattern:
      - {TAG: "MD", LOWER: {IN: ["should", "shall", "ought", "must"]}}

  # --- HEDGING / adverbials & approximators -------------------------------------
  - id: "morph.hedge.adverbial_perhaps"
    layer: "morpho_syntactic"
    category: "hedging"
    subcategory: "adverbial"
    source: "Lakoff 1973; Szarvas et al. 2012"
    #weight: 0.7
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["perhaps", "possibly", "probably", "presumably", "arguably", "conceivably"]}}

  - id: "morph.hedge.adverbial_maybe"
    layer: "morpho_syntactic"
    category: "hedging"
    subcategory: "adverbial"
    source: "Szarvas et al. 2012"
    #weight: 0.7
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["maybe", "likely", "unlikely"]}}

  - id: "morph.hedge.approximator_kind_of"
    layer: "morpho_syntactic"
    category: "hedging"
    subcategory: "approximator"
    note: "Approximator (Prince). This is the ONLY home for kind/sort of now (C-5 dedup)."
    source: "Prince et al. 1982; Salager-Meyer 1994; Szarvas et al. 2012"
    #weight: 0.6
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["kind", "sort"]}}
      - {LOWER: "of"}

  - id: "morph.hedge.approximator_somehow"
    layer: "morpho_syntactic"
    category: "hedging"
    subcategory: "approximator"
    source: "Szarvas et al. 2012"
    #weight: 0.5
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["somehow", "somewhat", "roughly", "approximately"]}}

  # --- NEGATION —-------------------------------------------------------------
  - id: "morph.neg.scoped_epistemic"
    layer: "morpho_syntactic"
    category: "negation"
    subcategory: "scoped_epistemic"
    note: "Negation attached to an epistemic head: 'no idea/clue/evidence/reason', 'not sure/clear'."
    source: "Vincze et al. 2008; Morante & Sporleder 2012"
    #weight: 0.9
    status: "active"
    type: "DependencyMatcher"
    # 0.2.2: sole owner of "not sure / not clear to me / no idea / no clue"
    # (lexical duplicates demoted). Realisation (2) added: in copular clauses
    # spaCy attaches the negator to the COPULA, not to the adjective, so v0.2
    # missed "I'm not sure", "it's not clear to me" — the bulk of lex.not_sure.
    patterns:
      # (1) negator is a direct child of the epistemic head ("Not sure, …", "no idea", "no clue")
      - - {RIGHT_ID: "head", RIGHT_ATTRS: {LEMMA: {IN: ["idea", "clue", "evidence", "reason", "explanation", "way", "knowledge", "sure", "clear", "certain", "obvious"]}}}
        - {LEFT_ID: "head", REL_OP: ">", RIGHT_ID: "neg", RIGHT_ATTRS: {LOWER: {IN: ["no", "not", "n't", "never"]}}}
      # (2) copular predicate: be + neg + acomp/attr ("I'm not sure why", "it's not clear to me")
      - - {RIGHT_ID: "cop", RIGHT_ATTRS: {LEMMA: "be"}}
        - {LEFT_ID: "cop", REL_OP: ">", RIGHT_ID: "neg", RIGHT_ATTRS: {DEP: "neg"}}
        - {LEFT_ID: "cop", REL_OP: ">", RIGHT_ID: "head", RIGHT_ATTRS: {LEMMA: {IN: ["sure", "clear", "certain", "obvious"]}, DEP: {IN: ["acomp", "attr"]}}}

  - id: "morph.neg.nobody_nothing"
    layer: "morpho_syntactic"
    category: "negation"
    subcategory: "quantifier_no"
    source: "Vincze et al. 2008"
    #weight: 0.3
    status: "candidate"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["nobody", "nothing", "nowhere", "neither"]}}

  # --- TENSE —----------------------------------------------------------------
  - id: "morph.tense.past_nk_notyet"
    layer: "morpho_syntactic"
    category: "tense"
    subcategory: "past_nk"
    note: "Negated verb with 'yet' as advmod: 'we haven't fixed this yet'. Replaces broken v0.1 rule."
    source: "Janich 2020"
    #weight: 0.6
    status: "active"
    type: "DependencyMatcher"
    pattern:
      - {RIGHT_ID: "verb", RIGHT_ATTRS: {POS: {IN: ["VERB", "AUX"]}}}
      - {LEFT_ID: "verb", REL_OP: ">", RIGHT_ID: "neg", RIGHT_ATTRS: {DEP: "neg"}}
      - {LEFT_ID: "verb", REL_OP: ">>", RIGHT_ID: "yet", RIGHT_ATTRS: {LOWER: "yet"}}

  - id: "morph.tense.future_nk_will_never"
    layer: "morpho_syntactic"
    category: "tense"
    subcategory: "future_nk"
    source: "Janich 2020; Bongelli et al. 2019 (epistemic future)"
    #weight: 0.6
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["will", "'ll"]}}
      - {LOWER: "never", OP: "?"}
      - {LOWER: {IN: ["know", "tell", "find"]}, OP: "?"}
      - {LOWER: "never"}

  - id: "morph.tense.future_nk_wont_know"
    layer: "morpho_syntactic"
    category: "tense"
    subcategory: "future_nk"
    source: "Janich 2020; Bongelli et al. 2019 (epistemic future)"
    #weight: 0.7
    status: "active"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["wo", "won't", "wont"]}}   # 0.2.2: can't/cannot removed — modal inability, not future; owned by neg_cognition_modal
      - {LOWER: "n't", OP: "?"}
      - {LOWER: {IN: ["know", "tell", "say", "determine"]}}

  # --- SYNTACTIC PATTERNS ----------------------------------------------------
  - id: "morph.syn.adversative"
    layer: "morpho_syntactic"
    category: "syntactic_pattern"
    subcategory: "adversative"
    note: "Low weight (C-9): NK-relevant only in an assertion+hedge contrast; scored as modifier."
    source: "Simon 2020"
    #weight: 0.2
    status: "candidate"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["but", "however", "although", "though", "nevertheless", "nonetheless"]}}

  - id: "morph.syn.embedded_question"
    layer: "morpho_syntactic"
    category: "syntactic_pattern"
    subcategory: "embedded_question"
    note: >
      Wh/if complement clause under an epistemic head, scoped by dependency.
      Two grammatical realisations: (1) the verb 'wonder' governing a wh/if
      clause; (2) a copula + epistemic adjective (unclear/unsure) with a wh/if
      clause. Fixes the v0.2 Matcher bug where a stray OP:"?" on the head made
      every bare if/how/when/which/what a false positive (21.6M signals,
      ~99.7% single-token). 'which'/'when' are excluded (relative pronoun /
      temporal subordinator, not interrogative complements).
    source: "San Roque et al. 2017; Bongelli et al. 2018; Riccioni et al. 2018"
    #weight: 0.8
    status: "active"
    type: "DependencyMatcher"
    patterns:
      # (1) Verb head: "I wonder whether/if/why/how/what/where…"
      - - {RIGHT_ID: "verb", RIGHT_ATTRS: {LEMMA: {IN: ["wonder"]}, POS: "VERB"}}
        - {LEFT_ID: "verb", REL_OP: ">>", RIGHT_ID: "wh", RIGHT_ATTRS: {LOWER: {IN: ["whether", "if", "why", "how", "what", "where"]}, DEP: {IN: ["mark", "advmod", "nsubj", "dobj", "pobj", "npadvmod", "attr", "acomp"]}}}
      # (2) Copula + epistemic adjective: "is unclear how…", "remains unsure whether…"
      - - {RIGHT_ID: "cop", RIGHT_ATTRS: {POS: {IN: ["AUX", "VERB"]}}}
        - {LEFT_ID: "cop", REL_OP: ">", RIGHT_ID: "adj", RIGHT_ATTRS: {LEMMA: {IN: ["unclear", "unsure"]}, POS: "ADJ", DEP: {IN: ["acomp", "attr", "oprd", "dobj", "amod"]}}}
        - {LEFT_ID: "cop", REL_OP: ">>", RIGHT_ID: "wh", RIGHT_ATTRS: {LOWER: {IN: ["whether", "if", "why", "how", "what", "where"]}, DEP: {IN: ["mark", "advmod", "nsubj", "dobj", "pobj", "npadvmod", "attr", "acomp"]}}}

  - id: "morph.syn.i_wonder"
    layer: "morpho_syntactic"
    category: "syntactic_pattern"
    subcategory: "embedded_question"
    source: "San Roque et al. 2017; Riccioni et al. 2018"
    #weight: 0.85
    status: "candidate"
    type: "Matcher"
    pattern:
      - {LOWER: {IN: ["i", "we"]}}
      - {LOWER: "wonder"}

  - id: "morph.syn.tag_question"
    layer: "morpho_syntactic"
    category: "syntactic_pattern"
    subcategory: "tag_question"
    note: "Confirmation-seeking tags: '…, right?', '…, no?', '…, correct?'."
    source: "San Roque et al. 2017; Bongelli et al. 2018"
    #weight: 0.6
    status: "active"
    type: "Matcher"
    pattern:
      - {IS_PUNCT: true, LOWER: ","}
      - {LOWER: {IN: ["right", "no", "correct", "yeah"]}}
      - {LOWER: "?"}

