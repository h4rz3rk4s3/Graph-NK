# rules/categories.yml
#
# Master registry of all Signal categories. Documentation only — nothing in
# the codebase currently loads or enforces this file at runtime (verified
# v0.2). It exists so a human (or a future validator) has one place to see
# every (rule_prefix, layer, category, subcategory) combination in use.
#
# v0.2.2 (2026-10-07): regenerated by walking the four pattern/lexicon files
# themselves (lexicons/en_core_v0.2.yml, patterns/morpho_syntactic_v0.2.yml,
# patterns/rhetorical_v0.2.yml, patterns/word_formation_v0.2.yml) rather than
# hand-transcribed, so it cannot drift from what the annotators actually load.
# This pass reflects the cross-layer ownership revision: the retired M-5
# SE-native, M-6 booster, M-7 general-extender and C-10 categories are gone
# (their lexical rules were removed), `booster` is no longer a lexical
# subcategory (boosters were removed), and the new morpho subcategory
# `not_knowing_ascribed` is registered. See MARKER_REVIEW.md and CHANGELOG
# 2026-10-07 for the rationale.
#
# Source: FRAMEWORK_DESIGN.md §4.3 table; MARKER_REVIEW.md.
# ─────────────────────────────────────────────────────────────────────────────

version: "0.2"

categories:
  # ── Lexical ──────────────────────────────────────────────────────────────
  - rule_prefix: "lex."
    layer: "lexical"
    category: "prototype"
    subcategories:
      - epistemic_state
      - imprecision
      - not_knowing              # v0.2 — M-1 (KUB 'Unknowing'; Rubin 2007)
      - plausibility_shield       # v0.2 — M-2 (Prince et al. 1982); v0.2.2 demoted to candidate
      - evidential_inferential    # v0.2 — M-3 (Aikhenvald 2004)
      - evidential_reportative    # v0.2 — M-3 (Aikhenvald 2004)
    source: "Simon & Janich 2023; Müller 2023; Bongelli et al. 2019 (KUB); Prince et al. 1982; Hyland 1996/2005; Aikhenvald 2004"

  - rule_prefix: "lex."
    layer: "lexical"
    category: "shared_feature"
    subcategories:
      - absence_of_X
      - pending_resolution
    source: "Müller 2023; Müller & Stegmeier 2019"

  # ── Morpho-syntactic ─────────────────────────────────────────────────────
  - rule_prefix: "morph.epi."
    layer: "morpho_syntactic"
    category: "epistemic_verb"
    subcategories:
      - not_knowing              # M-1, DependencyMatcher-scoped
      - not_knowing_ascribed      # v0.2.2 NEW (candidate) — negated know + non-1st-person subj
    source: "Bongelli et al. 2019/2023; Zuczkowski & Stemberger 2024 (KUB); Rubin 2007; Helmer et al. 2016; Weatherall 2011"

  - rule_prefix: "morph.hedge."
    layer: "morpho_syntactic"
    category: "hedging"
    subcategories:
      - adverbial
      - approximator
      - plausibility_shield       # M-2, DependencyMatcher-scoped (v0.2.2 sole owner)
      - attribution_shield        # M-2 ("as far as I know")
    source: "Prince et al. 1982; Salager-Meyer 1994; Hyland 1996; Szarvas et al. 2012; Kärkkäinen 2006"

  - rule_prefix: "morph.evid."
    layer: "morpho_syntactic"
    category: "evidential"
    subcategories:
      - inferential
    source: "Aikhenvald 2004; Aijmer 2009; Vold 2006 — M-3/C-6/C-7 (seem/appear/suggest/indicate moved here from modality)"

  - rule_prefix: "morph.mod."
    layer: "morpho_syntactic"
    category: "modality"
    subcategories:
      - epistemic               # C-1: may/might/must+be/have, high confidence
      - epistemic_prediction     # epistemic will/'ll
      - underspecified           # C-1: can/could/would, low weight; candidate since 2026-09-21
      - deontic                  # v0.2.2 demoted to candidate
    source: "Hyland 1996/2005; Vold 2006; Morante & Sporleder 2012; Marshman 2008 (MARKER_REVIEW C-1 for the modal-sense split)"

  - rule_prefix: "morph.neg."
    layer: "morpho_syntactic"
    category: "negation"
    subcategories:
      - scoped_epistemic   # C-3, DependencyMatcher-scoped; v0.2.2 sole owner of "not sure/clear, no idea/clue"
      - quantifier_no
    source: "Vincze et al. 2008; Morante & Sporleder 2012; Helmer et al. 2016 (MARKER_REVIEW C-3 for the scoping fix)"

  - rule_prefix: "morph.syn."
    layer: "morpho_syntactic"
    category: "syntactic_pattern"
    subcategories:
      - question_answer     # hardcoded unit-level check in morpho_syntactic.py, not YAML
      - adversative         # C-9: low-weight co-occurrence modifier
      - embedded_question    # M-4 (San Roque et al. 2017; Bongelli et al. 2018)
      - tag_question         # M-4; active since v0.2.2
    source: "Bongelli et al. 2018; Riccioni et al. 2018; San Roque et al. 2017; Simon 2020 (MARKER_REVIEW C-9/M-4)"

  - rule_prefix: "morph.tense."
    layer: "morpho_syntactic"
    category: "tense"
    subcategories:
      - past_nk    # C-4: DependencyMatcher (was a buggy double-'yet' token pattern)
      - future_nk
    source: "Janich 2020; Bongelli et al. 2019 (MARKER_REVIEW C-4 for the past_nk bug fix)"

  # ── Word-formation ────────────────────────────────────────────────────────
  - rule_prefix: "affix.prefix."
    layer: "word_formation"
    category: "affix_negation"
    subcategories:
      - un_prefix
      - in_prefix
      - non_prefix
      - dis_prefix
      - under_prefix   # C-8 (rescues underspecified/underdocumented/underdetermined)
      - mis_prefix     # NEW v0.2 (misunderstand/misinterpret — process NK)
    source: "Janich, Rhein & Simmerling 2010 (MARKER_REVIEW C-8 for the under- blocklist fix)"

  - rule_prefix: "affix.suffix."
    layer: "word_formation"
    category: "affix_negation"
    subcategories:
      - less_suffix
    source: "Janich, Rhein & Simmerling 2010"

  - rule_prefix: "affix.suffix."
    layer: "word_formation"
    category: "shared_feature"
    subcategories:
      - epistemic_potentiality  # C-2: was affix_modality/able_suffix, now allowlist-only
      - privative_certainty      # the -free suffix, deliberate NON-NK contrastive control
    source: "Janich, Rhein & Simmerling 2010 (MARKER_REVIEW C-2 for the -able relabel + allowlist fix)"

  # ── Rhetorical ───────────────────────────────────────────────────────────
  - rule_prefix: "rhetor."
    layer: "rhetorical"
    category: "metaphor"
    subcategories:
      - spatial_journey   # uncharted, new_territory
      - visibility        # blind_spot, dark, overlook
      - container         # knowledge_gap, missing_piece
    source: "Simmerling & Janich 2015; Smithson 2008 (v0.2.2 removed depth/opacity/obscurity figures)"

  - rule_prefix: "rhetor."
    layer: "rhetorical"
    category: "personification"
    subcategories:
      - poor_cousin
      - avoidance
    source: "Simmerling & Janich 2015"

  - rule_prefix: "rhetor."
    layer: "rhetorical"
    category: "comparison"
    subcategories:
      - approximator
    source: "Simmerling & Janich 2015 (MARKER_REVIEW C-5: 'kind of/sort of' duplicate removed — hedging layer only now)"

  # ── Classifier ────────────────────────────────────────────────────────────
  - rule_prefix: "clf."
    layer: "classifier"
    category: "roberta_binary"
    subcategories: []
    source: "RoBERTa fine-tuned NK classifier (see settings.classifier_model_path)"

