# ─────────────────────────────────────────────────────────────────────────────
# CHANGE LOG
# ─────────────────────────────────────────────────────────────────────────────
# 0.2.2 — Cross-layer ownership, 2026-10-07.
#   PRINCIPLE  Form-based ownership: a marker whose NK reading is produced by a
#              grammatical operator (negation, 1st-person subject + complement
#              clause, modal) scoping over an epistemic head belongs to the
#              morpho-syntactic layer, where scope is enforced. The lexical layer
#              keeps markers whose NK meaning is lexicalised in the item itself.
#   DEMOTED    active→candidate (superseded_by set): not_sure, not_clear_to_me,
#              no_idea, no_clue → morph.neg.scoped_epistemic; dont_know →
#              morph.epi.neg_cognition; cant_tell → morph.epi.neg_cognition_modal;
#              guess_v, suppose_v, assume_v, suspect_v, reckon_v →
#              morph.hedge.shield_think.
#   KEPT       unsure, clueless, confused, idk, who_knows, hard_to_tell,
#              hard_to_say (lexicalised / non-negated fixed phrases).
#   NOTE       The status flips take effect analysis-side via the YAML status
#              split (the canonical predicate resolves active/candidate from the
#              current YAMLs, never from the graph's stale annotation-time
#              status), so NO lexical re-annotation is needed for them. The
#              morpho replacements, however, gained new grammatical realisations
#              (copular "not sure/clear", pro-form shields) that are absent from
#              the graph for already-annotated units; close that gap with
#              scripts/backfill_morpho_gap.py — see CHANGELOG 2026-10-07. (The
#              separate 0.2.1 pass removed the unused M-5/M-6/M-7 entries; it is
#              recorded below and in CHANGELOG 2026-10-07.)
#   SOURCES    Literature list rebuilt from verified records (Crossref/OpenAlex;
#              see nk_citation_mapping.csv, nk_marker_paper_citations.bib).
#              Book citations replaced by journal papers where one exists.
#              Corrections: 'Janich & Simmerling 2013' → Janich, Rhein &
#              Simmerling 2010 (Fachsprache); 'Müller & Stegmüller 2019' →
#              Müller 2023 (paper) / Müller & Stegmeier 2019 (chapter);
#              'Janich & Simon 2017' → Simon & Janich 2023 (paper) / Janich,
#              Rhein & Simon 2023 (chapter). Removed from the header because no
#              lexical entry cites them: Lakoff 1973, Channell 1994, Simmerling &
#              Janich 2015 (Lakoff remains in morpho_syntactic_v0.2.yml).
#              Per-signal payload.source_citation refreshes only on re-annotation.
# 0.2.1 - Removed a few myself, as they didn't work.
# 0.2 — Review pass (MARKER_REVIEW.md).
#   ADDED   M-1 not-knowing phrases; M-2 plausibility shields; M-3 evidentials;
#           M-5 SE-native NK (repro/opacity/spec/doc/code-comment/abbrev);
#           M-6 boosters (non-NK, contrastive); M-7 general extenders.
#   CHANGED C-10 demoted risk/controversy/error/bug from prototype→shared_feature
#           (candidate, require epistemic context). Added weight/status/requires_context.
#   REMOVED nothing outright — demotions preserve provenance per framework policy.
#   NOTE    'kind of/sort of' lives in the hedging layer only now (C-5); the
#           rhetorical duplicate is dropped in rhetorical_v0.2.yml.
